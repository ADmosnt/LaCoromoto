server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (JS/CSS/imágenes con hash en el nombre) son
    # inmutables: el nombre cambia cuando cambia el contenido, así que
    # se pueden cachear "para siempre" sin riesgo de servir algo viejo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El index.html NO lleva hash y es quien apunta a cuál bundle cargar.
    # Nunca debe cachearse, de lo contrario tras un redeploy el navegador
    # sigue cargando el HTML viejo (y por ende el JS viejo) hasta que se
    # hace un hard refresh. Con esto se refresca solo en cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Serve React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Flask backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
